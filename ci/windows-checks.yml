name: windows-checks
on: [workflow_dispatch]
permissions: { contents: read }
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults: { run: { shell: pwsh } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: choco install ffmpeg -y --no-progress
      - run: npm ci; if ($LASTEXITCODE) { npm install }
      - run: npx playwright install chromium
      - run: python -m pip install numpy pyyaml
      - run: powershell -ExecutionPolicy Bypass -File tools\doctor.ps1
      - run: node tools\validate.mjs --json evidence\static\validate-windows.json
      - run: node tests\unit_paths.mjs
      - run: python tests\run_checks.py bisect-anything flaky-test-killer from-scratch design-system-build design-to-code-inspection interaction-motion-study code-loop scripted-screencast reverse-engineer-video
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: evidence-windows, path: evidence/ }
