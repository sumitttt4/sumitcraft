<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Study: seed swap (applies the principles, not the motif)</title>
<style>
  html, body { margin: 0; }
  .poster { width: 600px; height: 840px; background: #e9eef0; position: relative; overflow: hidden; color: #15202b; font-family: Georgia, "Times New Roman", serif; }
  /* accent shape: a tall leaf-like ellipse, bottom right, cropped (the reference used a disc, top right) */
  .leaf { position: absolute; width: 300px; height: 520px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; background: #2e7d5b; right: -90px; bottom: -120px; transform: rotate(-18deg); }
  /* structure: vertical rules instead of horizontal bars */
  .rule { position: absolute; top: 0; bottom: 0; left: 60px; width: 3px; background: #15202b; }
  .title { position: absolute; left: 90px; top: 80px; font-size: 84px; line-height: .92; letter-spacing: -.02em; }
  .meta { position: absolute; left: 92px; top: 270px; font: 600 14px/1.3 system-ui, sans-serif; letter-spacing: .16em; text-transform: uppercase; }
</style></head>
<body><div class="poster"><div class="rule"></div><div class="leaf"></div>
<div class="title">Seed<br>Swap</div><div class="meta">Bring a packet · take a packet<br>Saturday · the shed</div></div></body></html>
